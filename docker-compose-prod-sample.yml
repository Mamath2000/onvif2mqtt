services:
  onvif2mqtt:
    image: mathmath350/onvif2mqtt:latest
    container_name: onvif2mqtt
    restart: unless-stopped
    
    # Réseau host pour accès aux caméras
    network_mode: host
    
    volumes:
      - ./logs:/app/logs
      - ./config.conf:/app/config.conf:ro

    # Secrets référencés par ${VAR} dans config.conf (fichier .env gitignoré)
    env_file:
      - .env

    # Variables d'environnement
    environment:
      - NODE_ENV=production
      - TZ=Europe/Paris  # Ajustez selon votre timezone
    
    # No Docker healthcheck: health is published on MQTT <base_topic>/lwt (retained, LWT)
    
    # Configuration des logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"