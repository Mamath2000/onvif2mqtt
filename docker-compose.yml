services:
  onvif2mqtt:
    build: 
      context: .
      args:
        - GIT_REF=${GIT_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - VERSION=${VERSION:-1.0.0}
    container_name: onvif2mqtt
    restart: unless-stopped
    
    volumes:
      # Persister les logs
      - ./logs:/app/logs
      # Monter le fichier de configuration
      - ./config.conf:/app/config.conf:ro
    
    # Réseau : utiliser le réseau de l'hôte pour accéder aux caméras locales
    network_mode: host
    
    # Alternative : utiliser un réseau personnalisé si vous préférez
    # networks:
    #   - onvif-network
    # ports:
    #   - "3000:3000"
    
    # No Docker healthcheck: health is published on MQTT <base_topic>/lwt (retained, LWT)
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Réseau personnalisé (décommentez si vous n'utilisez pas host network)
# networks:
#   onvif-network:
#     driver: bridge