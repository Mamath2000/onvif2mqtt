version: '3.8'

services:
  onvif2mqtt:
    build: .
    container_name: onvif2mqtt
    restart: unless-stopped
    
    volumes:
      # Persister les logs
      - ./logs:/app/logs
      # Monter le fichier de configuration
      - ./config.conf:/app/config.conf:ro
    
    # Réseau : utiliser le réseau de l'hôte pour accéder aux caméras locales
    network_mode: host
    
    # Alternative : utiliser un réseau personnalisé si vous préférez
    # networks:
    #   - onvif-network
    # ports:
    #   - "3000:3000"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Health check OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Réseau personnalisé (décommentez si vous n'utilisez pas host network)
# networks:
#   onvif-network:
#     driver: bridge